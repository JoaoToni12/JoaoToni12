    <text x="64" y="168" font-size="28" font-weight="600" fill="#a8760f">Verification for LLM systems</text>
    <text x="64" y="208" font-size="19" fill="#5e5546">Evals that catch silent failures · guardrails that fail closed · audit trails you can check</text>
