  <rect width="1280" height="320" rx="18" fill="#fbf8f1"/>
  <rect width="1280" height="320" rx="18" fill="url(#d)"/>
  <rect x="1" y="1" width="1278" height="318" rx="17" fill="none" stroke="#a8760f" stroke-opacity=".45"/>
