    <ellipse rx="138" ry="92" fill="none" stroke="#a8760f" stroke-opacity=".28" stroke-dasharray="2 6"/>
    <ellipse rx="96" ry="64" fill="none" stroke="#a8760f" stroke-opacity=".45" stroke-dasharray="2 5"/>
    <ellipse rx="56" ry="38" fill="none" stroke="#a8760f" stroke-opacity=".8"/>
    <path d="M-80 -40 L0 0 M78 -44 L0 0 M10 86 L0 0" stroke="#a8760f" stroke-opacity=".55" stroke-width="1.2"/>
