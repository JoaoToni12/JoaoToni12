<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="João Gabriel Toni — Verification for LLM systems: evals, guardrails and audit trails">
  <defs>
    <pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#e4dccb"/></pattern>
    <radialGradient id="core"><stop offset="0" stop-color="#fff4cf"/><stop offset=".5" stop-color="#f3cf6b"/><stop offset="1" stop-color="#b98420"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#c99a2e" stop-opacity=".35"/><stop offset="1" stop-color="#c99a2e" stop-opacity="0"/></radialGradient>
